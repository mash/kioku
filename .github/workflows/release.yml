name: Release
on:
  push:
    branches: [main]
    paths: ['plugin/.claude-plugin/plugin.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing a release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      released: ${{ steps.source.outputs.released }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version and its bump commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=plugin/.claude-plugin/plugin.json
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.dry_run }}" == true ]]; then
            echo "version=v$(jq -r .version "$manifest")" >> "$GITHUB_OUTPUT"
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          # The tag names the latest commit that changed the version line, also on a retry.
          commit=$(git log -1 -G'"version"' --format=%H -- "$manifest")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$commit"
          version=$(jq -r .version "$manifest")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "plugin.json version must be X.Y.Z, got '$version'" >&2
            exit 1
          fi
          tag="v$version"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "Release $tag is already published"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists without a published release" >&2
            exit 1
          fi
          # Empty when no release exists yet.
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "Version $tag must be greater than the latest release $latest" >&2
            exit 1
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"
  checks:
    needs: source
    if: needs.source.outputs.released == 'false'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.source.outputs.commit }}
  build:
    needs: source
    if: needs.source.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Separate workloads and refresh compiled packages after source changes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Build client archives and checksums
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: make release VERSION="$RELEASE_VERSION" COMMIT="$RELEASE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kioku-cli-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [source, checks, build]
    if: github.ref == 'refs/heads/main' && needs.source.outputs.released == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kioku-cli-release
          path: dist
      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          # A failed earlier run can leave a draft. A draft has no tag, so delete it and start again.
          if [ "$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_VERSION" dist/kioku_*.tar.gz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --latest \
            --title "Kioku $RELEASE_VERSION" --notes-file dist/RELEASE_NOTES.md
