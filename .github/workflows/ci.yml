name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Build the self-hosting image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: final
          load: true
          tags: kioku:ci
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_PARALLELISM=4
            BUILD_MEMORY_LIMIT=5GiB
            BUILD_GOGC=100
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Check the image CLI and server
        run: |
          docker run --rm --entrypoint kioku kioku:ci version | grep -F "\"commit\":\"$GITHUB_SHA\""
          docker run -d --name kioku-ci -p 127.0.0.1:18080:8080 \
            -e KIOKU_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e KIOKU_STORAGE=local \
            -e GITHUB_CLIENT_ID=ci -e GITHUB_CLIENT_SECRET=ci kioku:ci
          trap 'docker logs kioku-ci; docker rm -fv kioku-ci' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            --max-time 5 http://127.0.0.1:18080/healthz
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Separate workloads and refresh compiled packages after source changes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-plugin-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-plugin-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Check plugin shell scripts
        run: for f in plugin/hooks/*.sh; do sh -n "$f"; done
      - name: Run plugin tests
        run: python3 -m unittest discover -s plugin/tests
      - name: Run plugin tests against the built CLI
        run: |
          go build -o "$RUNNER_TEMP/kioku" ./cmd/kioku
          python3 tools/test_claude_plugin.py --binary "$RUNNER_TEMP/kioku" --plugin plugin
